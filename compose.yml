services:
  frontend:
    build: ./frontend
    networks:
      - web

  backend:
    build: ./backend
    expose:
      - "3000"
    networks:
      - web

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    networks:
      - web

networks:
  web:
    driver: bridge
